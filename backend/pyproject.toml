[project]
name = "krushi-mitra-ai-backend"
version = "1.0.0"
description = "FastAPI AI Backend for Krushi Mitra AI"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
