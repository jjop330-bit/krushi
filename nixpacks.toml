providers = ["python"]

[variables]
PYTHONUNBUFFERED = "1"
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = ["...", "curl"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[start]
cmd = "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port ${PORT:-8000}"
